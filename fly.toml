# fly.toml app configuration file generated for chat-tv on 2025-11-23T14:03:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chat-tv'
primary_region = 'iad'

[build]

[env]
  PORT = '8080'

[processes]
  app = 'run -A ./server.ts'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
